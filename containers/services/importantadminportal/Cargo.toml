[package]
name = "importantadminportal"
version = "0.1.0"
edition = "2024"
description = "A honeypot that pretends to be an admin portal and records hostile clients"
license = "MIT"

[dependencies]
axum = "0.8"
rand = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
