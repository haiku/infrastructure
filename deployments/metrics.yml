### Haiku Metrics
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  labels:
    app: umami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umami
  template:
    metadata:
      labels:
        app: umami
    spec:
      containers:
      - name: umami
        imagePullPolicy: Always
        #image: ghcr.io/umami-software/umami:postgresql-latest
        image: ghcr.io/haiku/umami:postgresql-latest
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: umami-secrets
                key: umami_db_uri
          - name: APP_SECRET
            valueFrom:
              secretKeyRef:
                name: umami-secrets
                key: umami_secret
          - name: DATABASE_TYPE
            value: postgresql
        resources:
          limits:
            cpu: "1.0"
            memory: "1Gi"
          requests:
            cpu: "0.15"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: umami
spec:
  selector:
    app: umami
  ports:
  - name: www
    port: 3000
    targetPort: 3000
---
# web frontends for umami
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metrics
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: web,webs
spec:
  tls:
  - hosts:
    - metrics.haiku-os.org
    secretName: tls-cert-metrics
  rules:
  - host: metrics.haiku-os.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: umami
            port:
              name: www
