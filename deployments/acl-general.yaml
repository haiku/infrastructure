# Rate limit by User-Agent instead of by IP. Distributed scrapers rotate
# tens of thousands of source IPs but commonly reuse one UA string per run.
# average/period is per Traefik instance; with 4 ingress pods this is
# ~2 req/s per UA per host. Burst covers normal page + asset loads.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ua-ratelimit
spec:
  rateLimit:
    average: 1
    burst: 80
    period: 2s
    sourceCriterion:
      requestHeaderName: User-Agent
---
# Looser UA limit for API-ish hosts where legitimate clients can burst
# (HaikuDepot clients, SSO login asset loads, analytics beacons).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ua-ratelimit-loose
spec:
  rateLimit:
    average: 2
    burst: 200
    period: 1s
    sourceCriterion:
      requestHeaderName: User-Agent
